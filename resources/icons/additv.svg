<?xml version="1.0" encoding="utf-8"?>
<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Additv logo: 3D print cube with build plate, styled for PrusaSlicer icon system -->
  <!-- Build plate -->
  <path d="M2 12 L8 15 L14 12 L8 9 Z" stroke="#808080" stroke-width="0.8" fill="none" stroke-linejoin="round"/>
  <!-- Cube left face -->
  <path d="M4 11 L8 13 L8 8 L4 6 Z" fill="#ED6B21" fill-opacity="0.4" stroke="#ED6B21" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Cube right face -->
  <path d="M12 11 L8 13 L8 8 L12 6 Z" fill="#ED6B21" fill-opacity="0.2" stroke="#ED6B21" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Cube top face -->
  <path d="M4 6 L8 4 L12 6 L8 8 Z" fill="#ED6B21" fill-opacity="0.3" stroke="#808080" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Nozzle -->
  <path d="M7.5 1.5 L9.5 1.5 L8.8 3 L8.2 3 Z" fill="#808080"/>
  <rect x="7.8" y="3" width="1" height="0.8" fill="#808080" rx="0.1"/>
</svg>
