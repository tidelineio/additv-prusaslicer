name: Additv Build

on:
  push:
    branches: [additv/main]
  pull_request:
    branches: [additv/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_VERSION: '2.9.4'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v${UPSTREAM_VERSION}-additv.*" --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_ITER=$(echo "$LATEST_TAG" | sed 's/.*-additv\.//')
            NEXT_ITER=$((CURRENT_ITER + 1))
          else
            NEXT_ITER=1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${UPSTREAM_VERSION}-additv.${NEXT_ITER}-PR-${{ github.event.pull_request.number }}"
            IS_RELEASE=false
          else
            VERSION="${UPSTREAM_VERSION}-additv.${NEXT_ITER}"
            IS_RELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (release: $IS_RELEASE)"

  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/build
          key: linux-deps-v1-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'cmake/modules/**') }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake curl gettext git \
            libcurl4-openssl-dev libdbus-1-dev libegl-dev libgl-dev \
            libglu1-mesa-dev libgtk-3-dev libssl-dev libtool libudev-dev \
            libwayland-dev libwebkit2gtk-4.0-dev libx11-dev libxkbcommon-dev \
            locales m4 patchelf pkg-config texinfo unzip wget zlib1g-dev
          sudo locale-gen en_US.UTF-8

      - name: Pre-download unreliable deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps/build/downloads/GMP
          curl -sL --retry 3 --retry-delay 5 \
            -o deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2"

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          mkdir -p deps/build && cd deps/build
          cmake .. -DDEP_WX_GTK3=ON
          make -j$(nproc)

      - name: Build PrusaSlicer
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps/build/destdir/usr/local \
            -DCMAKE_BUILD_TYPE=Release \
            -DSLIC3R_STATIC=ON \
            -DSLIC3R_GTK=3 \
            -DSLIC3R_BUILD_TESTS=OFF
          make -j$(nproc)

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp build/src/PrusaSlicer dist/AdditvSlicer-${VERSION}-linux-x86_64
          chmod +x dist/AdditvSlicer-${VERSION}-linux-x86_64
          tar czf dist/AdditvSlicer-${VERSION}-linux-x86_64.tar.gz \
            -C dist AdditvSlicer-${VERSION}-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdditvSlicer-linux-x86_64
          path: dist/*.tar.gz

  build-macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: brew install automake autoconf gettext libtool texinfo m4 zlib

      - name: Install CMake 3.27.9
        run: |
          curl -sL https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-macos-universal.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/cmake-3.27.9-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/build
          key: macos-arm64-deps-v1-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'cmake/modules/**') }}

      - name: Pre-download unreliable deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # gmplib.org frequently times out from GitHub runners.
          # Pre-download from a GNU mirror into the expected cmake download dir.
          mkdir -p deps/build/downloads/GMP
          if [ ! -f deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 ]; then
            curl -sL --retry 3 --retry-delay 5 \
              -o deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 \
              "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2"
          fi

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps/build && cd deps/build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Build PrusaSlicer
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps/build/destdir/usr/local \
            -DCMAKE_BUILD_TYPE=Release \
            -DSLIC3R_STATIC=ON \
            -DSLIC3R_BUILD_TESTS=OFF
          make -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp build/src/PrusaSlicer dist/AdditvSlicer-${VERSION}-macos-arm64
          chmod +x dist/AdditvSlicer-${VERSION}-macos-arm64
          tar czf dist/AdditvSlicer-${VERSION}-macos-arm64.tar.gz \
            -C dist AdditvSlicer-${VERSION}-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdditvSlicer-macos-arm64
          path: dist/*.tar.gz

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/build
          key: windows-x64-deps-v1-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'cmake/modules/**') }}

      - name: Pre-download unreliable deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build/downloads/GMP
          curl -sL --retry 3 --retry-delay 5 \
            -o deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2"

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd deps
          mkdir build
          cd build
          cmake .. -DDEP_DEBUG=OFF
          cmake --build . --config Release

      - name: Build PrusaSlicer
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="%CD%\..\deps\build\destdir\usr\local" -DSLIC3R_BUILD_TESTS=OFF
          cmake --build . --config Release --target PrusaSlicer

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp build/src/Release/PrusaSlicer.exe "dist/AdditvSlicer-${VERSION}-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdditvSlicer-windows-x64
          path: dist/*.exe

  release:
    needs: [version, build-linux, build-macos, build-windows]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create tag
        run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Additv Slicer ${{ needs.version.outputs.version }}
          body: |
            ## Additv Slicer ${{ needs.version.outputs.version }}

            Based on PrusaSlicer ${{ env.UPSTREAM_VERSION }} with Additv farm integration.

            ### Features
            - OAuth login to Additv (account menu in top bar)
            - Send G-code to Additv farm (File > Export or sidebar button)
            - Filament selection, quantity, and order association
            - Persistent login across sessions

            ### Downloads
            - **macOS (Apple Silicon)**: `AdditvSlicer-*-macos-arm64.tar.gz`
            - **Windows (x64)**: `AdditvSlicer-*-windows-x64.exe`
            - **Linux (x86_64)**: `AdditvSlicer-*-linux-x86_64.tar.gz`
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
          draft: false
          prerelease: false
